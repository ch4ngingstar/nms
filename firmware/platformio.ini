; PlatformIO project for the ESP32 firmware probe (spec §3, §9.1).
;
; Two environments by design (spec §9): `esp32` builds the real firmware for the
; classic WROOM-32 (spec §3.1 — deliberately NOT the S3), while `native` compiles
; the host-testable logic modules on the development machine with Unity so the
; majority of coverage runs without a board attached.

[env:esp32]
; espressif32@6.9.0 is pinned: Arduino-ESP32 is built on ESP-IDF, so the
; esp_wifi_* radio APIs remain available as direct C calls (spec §3, framework row).
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; min_spiffs maximizes the app partition (spec §3.1 — no OTA, so the second app
; slot is wasted flash we spend on code instead).
board_build.partitions = min_spiffs.csv
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; PubSubClient defaults to a 256-byte buffer; the failure mode is silent
    ; truncation of exactly the large chunks that matter (spec §7). 1280 clears
    ; the protocol's 1024-byte message cap with envelope headroom.
    -DMQTT_MAX_PACKET_SIZE=1280

[env:native]
; Host build for the logic modules — no Arduino headers, no radio, no board
; (spec §9.1). This is where envelope/parser/state-machine coverage lives.
; ArduinoJson is header-only and host-portable, so the envelope and the runners'
; arg-parsing/chunk-building compile here; the lwIP socket paths in the runners
; are #ifdef'd out on native, leaving the pure parsers (port spec, DNS wire)
; directly unit-testable.
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^7.0
; Unity tests need the production modules compiled in, but only the host-portable
; ones — the radio/lwIP/FreeRTOS TUs must never reach the native linker. So pull
; `src` into the test build (test_build_src) and hand-pick exactly the modules the
; six suites cover (build_src_filter). port_scan.cpp is included for its pure
; parsePortSpec; its socket paths are #ifdef'd out on native (spec §9.1).
test_build_src = yes
build_src_filter =
    -<*>
    +<envelope.cpp>
    +<backoff.cpp>
    +<job_dedup.cpp>
    +<outbox.cpp>
    +<runners/port_scan.cpp>
build_flags =
    -std=c++17
